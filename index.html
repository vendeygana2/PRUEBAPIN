<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Pines</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        .container {
            display: inline-block;
            text-align: left;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            background-color: #28a745;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Venta de Pines</h1>
    <div class="container">
        <form id="pinForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="pin">Selecciona el tipo de pin:</label>
                <select id="pin" name="pin" required>
                    <option value="100">100 Bs = 20 Bs</option>
                    <option value="200">200 Bs = 30 Bs</option>
                </select>
            </div>
            <button type="submit">Comprar Pin</button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec'; // Reemplazar con tu Script ID
        const form = document.getElementById('pinForm');

        form.addEventListener('submit', e => {
            e.preventDefault();

            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => alert('¡Compra registrada con éxito!'))
                .catch(error => alert('Error al registrar la compra. Inténtalo de nuevo.'));
        });
    </script>
</body>
</html>
